# What a JC8012P4A1 v3 gets when it takes this plugin: its built-in OV02C10 camera as ESPHome's camera, which Home
# Assistant shows as a camera of the screen's device, and the camera in the top bar while Home Assistant takes pictures.
# The sensor answers on the board's touch bus (GPIO7 SDA, GPIO8 SCL) at 0x36, clocks itself and has no reset or
# power-down pin, so nothing here owns a pin.

# The sensor through the ESP32-P4's camera interface, image processor and hardware JPEG encoder (Espressif's esp_video).
# Pictures are made only while Home Assistant asks for them, at most two a second; the pipeline rests five seconds after
# the last one. 1288x728 is the sensor mode proven on this board (one MIPI lane).
esp_video_camera:
  id: ts_camera
  name: "Camera"
  i2c_id: touch_bus
  enable_xclk: false
  xclk_pin: -1
  device: jpeg
  resolution: 1288x728
  jpeg_quality: 80                 # 1 to 100, higher is better: a picture of about 150 to 300 KB
  max_framerate: 2

# The picture the right way round: the sensor mirrors and flips itself, so the image processor and the JPEG encoder have
# no extra work. Both take effect on the next picture.
switch:
  - platform: template
    id: jc8012_camera_mirror
    name: "Camera mirror"
    icon: mdi:flip-horizontal
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    turn_on_action:
      - lambda: id(ts_camera).set_runtime_hflip(true);
    turn_off_action:
      - lambda: id(ts_camera).set_runtime_hflip(false);
  - platform: template
    id: jc8012_camera_flip
    name: "Camera flip"
    icon: mdi:flip-vertical
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    turn_on_action:
      - lambda: id(ts_camera).set_runtime_vflip(true);
    turn_off_action:
      - lambda: id(ts_camera).set_runtime_vflip(false);
  # Light level and motion from the camera's frames, worked out on the screen: no picture leaves it for them. While it is
  # on the camera keeps running (at the two frames a second above), and the eye can show in the top bar.
  - platform: template
    id: jc8012_camera_sensing
    name: "Camera motion and light"
    icon: mdi:motion-sensor
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    turn_on_action:
      - lambda: id(jc8012_camera_plugin).set_sensing(true);
    turn_off_action:
      - lambda: id(jc8012_camera_plugin).set_sensing(false);
  # Motion wakes the screen from standby, as a touch does (Tessera's own wake_display script).
  - platform: template
    id: jc8012_camera_wake
    name: "Wake screen on motion"
    icon: mdi:monitor-eye
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

# Why the camera does or does not work, for Home Assistant: the camera starts before Home Assistant connects, so the
# plugin keeps what the camera said in the log while it started (the sensor found, errors of the image pipeline).
text_sensor:
  - platform: template
    id: jc8012_camera_status
    name: "Camera status"
    icon: mdi:cctv
    entity_category: diagnostic
    update_interval: never

jc8012_camera:
  id: jc8012_camera_plugin
  camera: ts_camera
  status: jc8012_camera_status
  illuminance:
    name: "Light level"
  motion:
    name: "Motion"
    filters:
      - delayed_off: 10s
    on_press:
      - if:
          condition:
            switch.is_on: jc8012_camera_wake
          then:
            - script.execute: wake_display
