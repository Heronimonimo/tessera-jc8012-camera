# The plugin's check and a whole JC8012P4A1 v3 firmware with it, as the Tessera add-on builds it: Tessera's screen
# package at a release, the add-on's ESPHome, and this plugin beside it. Then it looks into the build for what only shows
# there: the OV02C10 detect entry in the firmware and the OV02C10 image tuning in esp_ipa's configuration.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tessera_ref:
        description: Tessera ref to build against (a screens-v* tag or a branch)
        default: screens-v0.4.89
      esphome:
        description: ESPHome version (the Tessera add-on's)
        default: 2026.9.0

env:
  TESSERA_REF: ${{ inputs.tessera_ref || 'screens-v0.4.89' }}
  ESPHOME_VERSION: ${{ inputs.esphome || '2026.9.0' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: plugin }
      - uses: actions/checkout@v4
        with: { repository: MaxGramser/tessera-plugins, path: tessera-plugins }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m pip install pyyaml
      - run: python tessera-plugins/tools/check.py plugin

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { path: plugin }
      - uses: actions/checkout@v4
        with:
          repository: MaxGramser/homeassistant_espscreen
          ref: ${{ env.TESSERA_REF }}
          path: tessera
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m pip install "esphome==${ESPHOME_VERSION}"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/esphome
          key: esphome-${{ runner.os }}-${{ env.ESPHOME_VERSION }}-${{ env.TESSERA_REF }}
          restore-keys: esphome-${{ runner.os }}-${{ env.ESPHOME_VERSION }}-
      - name: Screen with the plugin
        working-directory: tessera/checkout
        run: |
          # Throwaway secrets: this firmware is only built, never flashed.
          cat > secrets.yaml <<EOF
          wifi_ssid: "ci"
          wifi_password: "ci-password"
          api_encryption_key: "$(head -c 32 /dev/urandom | base64)"
          ota_password: "ci-ota"
          ap_password: "ci-ap-password"
          EOF
          # As Tessera writes a screen's plugins file (docs/TESTING.md in tessera-plugins, "A build on your own computer").
          cat > ci-camera.yaml <<'EOF'
          packages:
            screen: !include jc8012p4a1v3.yaml
            plugin_jc8012_camera: !include ../../plugin/plugin.yaml
          external_components:
            - source: { type: local, path: ../../plugin/components }
          EOF
      - name: esphome compile
        working-directory: tessera/checkout
        run: esphome compile ci-camera.yaml
      - name: What only the build shows
        working-directory: tessera/checkout
        run: |
          build=$(ls -d .esphome/build/*/ | head -1)
          echo "Build folder: $build"
          test -f "$build/components/ov02c10_ipa/project_include.cmake" \
            || { echo "::error::the ov02c10_ipa component is not in the build"; exit 1; }
          ipa=$(grep -rl --include='*.c' '"OV02C10"' "$build" | grep -v '/components/' | head -1 || true)
          test -n "$ipa" || { echo "::error::esp_ipa's generated configuration has no OV02C10"; exit 1; }
          echo "OV02C10 tuning compiled in: $ipa"
          map=$(find "$build" -name '*.map' | head -1)
          grep -E '^\s*\.esp_cam_sensor_detect_fn' -A1 "$map" | grep -q 'ov02c10_sensor' \
            || { echo "::error::the OV02C10 detect entry is not in the firmware ($map)"; exit 1; }
          echo "OV02C10 detect entry linked: $map"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-${{ env.TESSERA_REF }}
          path: |
            tessera/checkout/.esphome/build/*/build/*.map
            tessera/checkout/.esphome/build/*/build/*.bin
          if-no-files-found: ignore
